<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明星消耗分析</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2118;--muted:#8a7c6b;--line:#ece4d6;--gold:#a5722c;--gold-d:#7c521a;--accent:#c0392b;--chip:#f3ead9;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
header{margin-bottom:22px}
h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
h1 .g{color:var(--gold)}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card .k{font-size:12px;color:var(--muted);letter-spacing:.5px}
.card .v{font-size:26px;font-weight:800;margin-top:4px;color:var(--gold-d)}
.card .v small{font-size:14px;font-weight:600;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 16px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
.tab:hover{border-color:var(--gold);color:var(--gold-d)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#fff}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px;font-size:14px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.indsel{display:none;gap:8px;flex-wrap:wrap;align-items:center}
.indsel.show{display:flex}
.indsel label{font-size:13px;color:var(--muted)}
select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--card);color:var(--ink);outline:none;cursor:pointer}
select:focus{border-color:var(--gold)}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{background:#faf6ee;text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--gold-d)}
thead th .arr{font-size:10px;opacity:.4;margin-left:4px}
thead th.sorted .arr{opacity:1;color:var(--gold)}
tbody td{padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px}
tbody tr:hover{background:#fbf8f2}
tbody tr:last-child td{border-bottom:none}
.rank{width:52px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.rank.top{color:var(--gold)}
.rkbadge{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:8px;font-size:12.5px;font-weight:800;background:#f3ead9;color:var(--gold-d)}
.rkbadge.r1{background:linear-gradient(135deg,#d4af37,#b8860b);color:#fff}
.rkbadge.r2{background:linear-gradient(135deg,#c0c0c0,#9a9a9a);color:#fff}
.rkbadge.r3{background:linear-gradient(135deg,#cd7f32,#a05a1c);color:#fff}
.star-name{font-weight:600}
.ind-tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:6px;background:var(--chip);color:var(--gold-d);font-weight:600}
.cost{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.cost .u{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.barcell{width:26%}
.bar{height:7px;border-radius:4px;background:#f0e8da;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#d8b273,var(--gold));border-radius:4px}
.empty{padding:50px;text-align:center;color:var(--muted);font-size:14px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.pager button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--ink);font-weight:600}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:not(:disabled):hover{border-color:var(--gold);color:var(--gold-d)}
.pager .pg{font-size:13px;color:var(--muted)}
.foot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.foot b{color:var(--ink)}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.barcell{display:none}.wrap{padding:20px 14px 40px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>明星<span class="g">消耗</span>排行分析</h1>
  <div class="sub">数据已清洗：空明星名丢弃 · 多明星行按单个明星拆分加总（不均分消耗）· 已排除"整体"汇总行</div>
</header>

<div class="tabs" id="tabs" style="margin-top:18px">
  <button class="tab on" data-mode="all">不拆分行业 · 明星总消耗</button>
  <button class="tab" data-mode="industry">拆分行业 · 按行业看明星</button>
</div>

<div class="toolbar">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="搜索明星名称…">
  </div>
  <div class="indsel" id="indsel">
    <label>行业</label>
    <select id="ind"><option value="__all">全部行业</option></select>
  </div>
  <span class="count" id="count"></span>
</div>

<div class="tablewrap">
  <table>
    <thead>
      <tr id="headrow">
        <th class="rank">#</th>
        <th data-key="s">明星名称<span class="arr">↕</span></th>
        <th data-key="i" id="col-ind">行业<span class="arr">↕</span></th>
        <th data-key="c" class="sorted">消耗区间<span class="arr">↓</span></th>
        <th class="barcell">占比</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">没有匹配的数据</div>
</div>

<div class="pager" id="pager">
  <button id="prev">上一页</button>
  <span class="pg" id="pg"></span>
  <button id="next">下一页</button>
</div>

<div class="foot">
  <b>口径说明：</b>①"不拆分行业"视图=每位明星在所有行业下的消耗合计（来源：第二个数据表）；②"拆分行业"视图=明星×行业明细，可按行业筛选（来源：第一个数据表）；③多明星素材（如"A#B"）拆为A、B两行，<b>每人均计入该行完整消耗</b>，不做均分；④明星名称为空的行已丢弃；⑤金额单位：万元。
</div>
</div>

const {stats, industries, total, by_industry, detail} = DATA;

// 状态
let mode='all', curInd='__all', query='', sortKey='c', sortDir=-1, page=1;
const PAGE=50;

// 行业下拉
const indSel=document.getElementById('ind');
industries.forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=i;indSel.appendChild(o);});

function currentRows(){
  let rows;
  if(mode==='all'){
    rows = total.map(x=>({s:x.s, i:'—', c:x.c}));
  }else{
    if(curInd==='__all'){
      rows = detail.map(x=>({s:x.s, i:x.i, c:x.c}));
    }else{
      rows = (by_industry[curInd]||[]).map(x=>({s:x.s, i:curInd, c:x.c}));
    }
  }
  if(query){ const q=query.toLowerCase(); rows=rows.filter(r=>r.s.toLowerCase().includes(q)); }
  rows.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(sortKey==='c'){ return (va-vb)*sortDir; }
    return String(va).localeCompare(String(vb),'zh')*sortDir;
  });
  return rows;
}

function render(){
  const rows=currentRows();
  const max=rows.length?rows[0].c:0; // 排序后最大值未必在首位，改为取当前集合最大
  const realMax=rows.reduce((m,r)=>Math.max(m,r.c),0)||1;
  const tp=Math.max(1,Math.ceil(rows.length/PAGE));
  if(page>tp)page=tp; if(page<1)page=1;
  const start=(page-1)*PAGE;
  const slice=rows.slice(start,start+PAGE);
  const tb=document.getElementById('tbody');
  const showInd = mode==='industry' && curInd==='__all';
  document.getElementById('col-ind').style.display = mode==='all' ? 'none' : '';
  tb.innerHTML=slice.map((r,idx)=>{
    const rank=start+idx+1;
    let badge=`<span class="rkbadge${rank===1?' r1':rank===2?' r2':rank===3?' r3':''}">${rank}</span>`;
    const pct=Math.max(2, r.c/realMax*100);
    const indCell = showInd ? `<td><span class="ind-tag">${r.i}</span></td>` : (mode==='all'?'':`<td><span class="ind-tag">${r.i}</span></td>`);
    return `<tr>
      <td class="rank">${badge}</td>
      <td class="star-name">${esc(r.s)}</td>
      ${mode==='all'?'':indCell}
      <td class="cost">${bucket(r.c)}</td>
      <td class="barcell"><div class="bar"><span style="width:${pct}%"></span></div></td>
    </tr>`;
  }).join('');
  document.getElementById('empty').style.display=slice.length?'none':'block';
  document.getElementById('count').textContent=`共 ${rows.length.toLocaleString()} 条 · 每页 ${PAGE} 条`;
  document.getElementById('pg').textContent=`${page} / ${tp}`;
  document.getElementById('prev').disabled=page<=1;
  document.getElementById('next').disabled=page>=tp;
  // 表头排序态
  document.querySelectorAll('th[data-key]').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key===sortKey);
    const arr=th.querySelector('.arr');
    if(arr) arr.textContent = th.dataset.key===sortKey ? (sortDir===-1?'↓':'↑') : '↕';
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// 消耗数值模糊化为区间（单位：万元）
function bucket(c){
  if(c<10) return '10万以下';
  if(c<50) return '10-50万';
  if(c<100) return '50-100万';
  if(c<500) return '100-500万';
  if(c<1000) return '500-1000万';
  if(c<5000) return '1000-5000万';
  if(c<10000) return '5000万-1亿';
  return '1亿以上';
}

// 事件
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.mode; page=1;
  document.getElementById('indsel').classList.toggle('show', mode==='industry');
  sortKey='c'; sortDir=-1;
  render();
});
indSel.addEventListener('change',e=>{curInd=e.target.value;page=1;render();});
let qt; document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim();page=1;render();},150);});
document.querySelectorAll('th[data-key]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.key;
  if(sortKey===k){sortDir*=-1;}else{sortKey=k;sortDir=(k==='c')?-1:1;}
  render();
}));
document.getElementById('prev').addEventListener('click',()=>{page--;render();window.scrollTo({top:0,behavior:'smooth'});});
document.getElementById('next').addEventListener('click',()=>{page++;render();window.scrollTo({top:0,behavior:'smooth'});});

render();
